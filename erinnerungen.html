<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I + B | Erinnerungen</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="erinnerungen.css">
</head>
<body>

  <main class="page">
    <h1 class="page-title">Erinnerungen 📸</h1>
    <p class="page-subtitle">Eure gemeinsamen Trips – zum Anfassen nah</p>

    <section id="memoryOverview">
      <div id="memoryGrid" class="memory-grid"></div>
    </section>

    <section id="galleryView" class="hidden">
      <button id="backToMemories" class="btn btn-secondary back-button">
        ← Zurück zur Übersicht
      </button>

      <div class="gallery-header card">
        <div class="gallery-cover">
          <img id="galleryCoverImg" src="" alt="">
        </div>
        <div class="gallery-header-text">
          <h2 id="galleryTitle"></h2>
          <p id="galleryInfo"></p>
          <button id="editTripBtn" class="btn btn-sm btn-secondary">✏️ Trip bearbeiten</button>
        </div>
      </div>

      <div id="dropzone" class="dropzone card">
        <input id="imageInput" type="file" accept="image/*" multiple hidden>
        <span class="dropzone-icon">📤</span>
        <p class="dropzone-text"><strong>Bilder hierher ziehen</strong> oder klicken zum Auswählen</p>
        <p class="dropzone-hint">Mehrere Bilder gleichzeitig möglich</p>
      </div>

      <div id="uploadQueue" class="upload-queue hidden">
        <div id="uploadPreviewList" class="upload-preview-list"></div>
        <label>Beschriftung (optional, gilt für alle)</label>
        <input id="captionInput" type="text" placeholder="z. B. Sonnenuntergang am Strand">
        <div class="modal-buttons">
          <button id="uploadImageBtn" class="btn">Hochladen</button>
          <button id="clearQueueBtn" class="btn btn-secondary">Auswahl leeren</button>
        </div>
      </div>

      <div id="imageGrid" class="image-grid"></div>
    </section>
  </main>

  <button id="openMemoryModal" class="fab" title="Neue Erinnerung" aria-label="Neue Erinnerung">+</button>

  <div id="memoryModal" class="modal hidden">
    <div class="modal-box">
      <h2 id="memoryModalTitle">Neue Erinnerung</h2>

      <label>Titel</label>
      <input id="memoryTitleInput" type="text" placeholder="z. B. Hamburg">

      <label>Ort</label>
      <input id="memoryLocationInput" type="text" placeholder="z. B. Hamburg">

      <label>Startdatum</label>
      <input id="memoryStartInput" type="date">

      <label>Enddatum</label>
      <input id="memoryEndInput" type="date">

      <label>Coverbild</label>
      <div id="coverPreviewWrap" class="cover-preview hidden">
        <img id="coverPreviewImg" src="" alt="Aktuelles Cover">
      </div>
      <input id="coverInput" type="file" accept="image/*">

      <div class="modal-buttons">
        <button id="saveMemoryBtn" class="btn">Erinnerung erstellen</button>
        <button id="closeMemoryModal" class="btn btn-secondary">Abbrechen</button>
      </div>
    </div>
  </div>

  <div id="imageLightbox" class="lightbox hidden">
    <button id="closeLightbox" class="close-lightbox">×</button>
    <img id="lightboxImage" src="" alt="Großansicht">
    <p id="lightboxCaption" class="lightbox-caption"></p>
  </div>

  <nav class="app-nav" aria-label="Hauptnavigation">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
    <a href="couple-quest.html" class="nav-item"><span class="nav-icon">🎯</span><span class="nav-label">Quest</span></a>
    <a href="batterien.html" class="nav-item"><span class="nav-icon">🔋</span><span class="nav-label">Akku</span></a>
    <a href="kpis.html" class="nav-item"><span class="nav-icon">📊</span><span class="nav-label">KPIs</span></a>
    <a href="erinnerungen.html" class="nav-item"><span class="nav-icon">📸</span><span class="nav-label">Trips</span></a>
    <a href="questions.html" class="nav-item"><span class="nav-icon">💬</span><span class="nav-label">Fragen</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js"></script>
  <script src="erinnerungen.js"></script>
</body>
</html>
