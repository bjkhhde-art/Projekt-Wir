<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projekt Wir - Erinnerungen</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <link rel="stylesheet" href="erinnerungen.css">
</head>
<body>

  <h1>Erinnerungen 📸</h1>

  <nav class="main-nav">
    <a href="index.html">🎯 Couple Quest</a>
    <a href="shopping.html">🛒 Einkaufsliste</a>
    <a href="kpis.html">📊 KPIs</a>
    <a href="erinnerungen.html">📸 Erinnerungen</a>
  </nav>

  <section id="memoryOverview">
    <button id="openMemoryModal" class="main-button">
      + Neue Erinnerung
    </button>

    <div id="memoryGrid" class="memory-grid"></div>
  </section>

  <section id="galleryView" class="hidden">
    <button id="backToMemories" class="back-button">
      ← Zurück
    </button>

    <div class="gallery-header">
      <h2 id="galleryTitle"></h2>
      <p id="galleryInfo"></p>
    </div>

    <div class="upload-card">
      <input id="imageInput" type="file" accept="image/*">
      <input id="captionInput" type="text" placeholder="Bildbeschreibung optional">
      <button id="uploadImageBtn">Bild hinzufügen</button>
    </div>

    <div id="imageGrid" class="image-grid"></div>
  </section>

  <div id="memoryModal" class="modal hidden">
    <div class="modal-box">
      <h2>Neue Erinnerung</h2>

      <label>Titel</label>
      <input id="memoryTitleInput" type="text" placeholder="z. B. Hamburg">

      <label>Ort</label>
      <input id="memoryLocationInput" type="text" placeholder="z. B. Hamburg">

      <label>Startdatum</label>
      <input id="memoryStartInput" type="date">

      <label>Enddatum</label>
      <input id="memoryEndInput" type="date">

      <label>Coverbild</label>
      <input id="coverInput" type="file" accept="image/*">

      <div class="modal-buttons">
        <button id="createMemoryBtn">Erinnerung erstellen</button>
        <button id="closeMemoryModal" class="secondary">Abbrechen</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="erinnerungen.js"></script>
</body>
</html>
