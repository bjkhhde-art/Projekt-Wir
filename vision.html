<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I + B | Vision</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="vision.css">
  <script src="pin-lock.js"></script>
</head>
<body>

  <main class="page">
    <h1 class="page-title">Unsere Vision 🔭</h1>
    <p class="page-subtitle">Was wir gemeinsam erreichen möchten, Schritt für Schritt</p>

    <div id="visionTimeline" class="vision-timeline"></div>
  </main>

  <button id="openVisionModal" class="fab" title="Neues Ziel" aria-label="Neues Ziel">+</button>

  <div id="visionModal" class="modal hidden">
    <div class="modal-box">
      <h2 id="visionModalTitle">Neues Ziel</h2>

      <label>Titel</label>
      <input id="visionTitleInput" type="text" placeholder="z. B. Eigenes Haus">

      <label>Beschreibung</label>
      <textarea id="visionDescInput" rows="3" placeholder="Was genau stellen wir uns vor?"></textarea>

      <label>Ungefähr wann?</label>
      <select id="visionHorizonInput">
        <option value="bald">Schon bald (&lt; 1 Jahr)</option>
        <option value="1_2">In 1–2 Jahren</option>
        <option value="3_5">In 3–5 Jahren</option>
        <option value="5_plus">In über 5 Jahren</option>
        <option value="irgendwann">Irgendwann</option>
      </select>

      <label>Bild (optional)</label>
      <div id="visionCoverPreviewWrap" class="cover-preview hidden">
        <img id="visionCoverPreviewImg" src="" alt="Aktuelles Bild">
      </div>
      <input id="visionCoverInput" type="file" accept="image/*">

      <div class="modal-buttons">
        <button id="saveVisionBtn" class="btn">Ziel eintragen</button>
        <button id="closeVisionModal" class="btn btn-secondary">Abbrechen</button>
      </div>
    </div>
  </div>

  <div id="personModal" class="modal hidden">
    <div class="modal-box">
      <h2>Wer bist du? 💗</h2>
      <p class="push-modal-text">Damit wir wissen, wer dieses Ziel eingetragen hat.</p>
      <div class="push-person-choice">
        <button class="btn person-choice-btn" data-person="Isi">Ich bin Isi</button>
        <button class="btn btn-secondary person-choice-btn" data-person="Benji">Ich bin Benji</button>
      </div>
    </div>
  </div>

  <nav class="app-nav" aria-label="Hauptnavigation">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
    <a href="couple-quest.html" class="nav-item"><span class="nav-icon">🎯</span><span class="nav-label">Quest</span></a>
    <a href="batterien.html" class="nav-item"><span class="nav-icon">🔋</span><span class="nav-label">Akku</span></a>
    <a href="mochi.html" class="nav-item"><span class="nav-icon">🎂</span><span class="nav-label">Mochi</span></a>
    <a href="reflexion.html" class="nav-item"><span class="nav-icon">🪞</span><span class="nav-label">Reflexion</span></a>
    <a href="vergleich.html" class="nav-item"><span class="nav-icon">🌍</span><span class="nav-label">Vergleich</span></a>
    <a href="erinnerungen.html" class="nav-item"><span class="nav-icon">📸</span><span class="nav-label">Trips</span></a>
    <a href="vision.html" class="nav-item"><span class="nav-icon">🔭</span><span class="nav-label">Vision</span></a>
    <a href="questions.html" class="nav-item"><span class="nav-icon">💬</span><span class="nav-label">Fragen</span></a>
    <a href="liebesbriefe.html" class="nav-item"><span class="nav-icon">💌</span><span class="nav-label">Briefe</span></a>
    <a href="einstellungen.html" class="nav-item"><span class="nav-icon">⚙️</span><span class="nav-label">Einstellungen</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js"></script>
  <script src="vision.js"></script>
</body>
</html>
