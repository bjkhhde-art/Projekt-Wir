<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I + B | Mochi</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="mochi.css">
  <script src="pin-lock.js"></script>
</head>
<body>

  <main class="page">
    <h1 class="page-title">Mochi 🧸</h1>
    <p class="page-subtitle">Euer kleines Kuschelwesen – sein Gemüt hängt an eurer Nähe</p>

    <div class="pet-stage card">
      <p id="moodLabel" class="mood-label"></p>

      <div id="petCreature" class="pet-creature mood-neutral">
        <div class="pet-cheek pet-cheek-left"></div>
        <div class="pet-cheek pet-cheek-right"></div>
        <div class="pet-body">
          <div class="pet-eyes">
            <div class="pet-eye"></div>
            <div class="pet-eye"></div>
          </div>
          <div class="pet-mouth"></div>
          <div class="pet-tear pet-tear-left hidden"></div>
          <div class="pet-tear pet-tear-right hidden"></div>
        </div>
        <div id="petHearts" class="pet-hearts"></div>
      </div>

      <p id="petStatusText" class="pet-status-text">Mochi wird wach…</p>

      <div class="pet-happiness-bar">
        <div id="petHappinessFill" class="pet-happiness-fill"></div>
      </div>

      <p class="pet-hint">Streichle Mochi mit einer Wischbewegung – oder halte gedrückt zum Kuscheln 🤗</p>
    </div>
  </main>

  <div id="personModal" class="modal hidden">
    <div class="modal-box">
      <h2>Wer bist du? 💗</h2>
      <p class="push-modal-text">Damit Mochi weiß, wer ihn gerade streichelt.</p>
      <div class="push-person-choice">
        <button class="btn person-choice-btn" data-person="Isi">Ich bin Isi</button>
        <button class="btn btn-secondary person-choice-btn" data-person="Benji">Ich bin Benji</button>
      </div>
    </div>
  </div>

    <a href="erinnerungen.html" class="nav-item"><span class="nav-icon">📸</span><span class="nav-label">Trips</span></a>

  <script src="mochi.js"></script>
</body>
</html>
