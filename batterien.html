<head>
  <meta charset="UTF-8">

  <title>I + B | Kuschelbatterien</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="batterien.css">

<body>

  <main class="page">
    <h1 class="page-title">Kuschelbatterien 🔋</h1>
    <p class="page-subtitle">Wisch eine Batterie hoch oder runter, um den Kuschel-Akku zu laden</p>

    <div class="battery-row">

      <div class="battery-unit">
        <div class="battery-name">Isi G</div>

        <div class="battery-shell" id="battery-isi-g" data-person="Isi G">
          <div class="battery-nub"></div>
          <div class="battery-inner">
            <div class="battery-fill"></div>
            <div class="battery-shine"></div>
          </div>
          <div class="battery-spark hidden">⚡</div>
        </div>

        <div class="battery-readout">
          <span class="battery-emoji" id="emoji-isi-g">🙂</span>
          <span class="battery-percent" id="percent-isi-g">50%</span>
        </div>

        <p class="battery-status" id="status-isi-g">Bereit zum Kuscheln</p>
      </div>

      <div class="battery-unit">
        <div class="battery-name">Benji</div>

        <div class="battery-shell" id="battery-benji" data-person="Benji">
          <div class="battery-nub"></div>
          <div class="battery-inner">
            <div class="battery-fill"></div>
            <div class="battery-shine"></div>
          </div>
          <div class="battery-spark hidden">⚡</div>
        </div>

        <div class="battery-readout">
          <span class="battery-emoji" id="emoji-benji">🙂</span>
          <span class="battery-percent" id="percent-benji">50%</span>
        </div>

        <p class="battery-status" id="status-benji">Bereit zum Kuscheln</p>
      </div>

    </div>
  </main>
