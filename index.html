<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wir</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Wir 💗</h1>

  <nav class="main-nav">
    <a href="index.html">🎯 Couple Quest</a>
    <a href="shopping.html">🛒 Einkaufsliste</a>
    <a href="kpis.html">📊 KPIs</a>
    <a href="erinnerungen.html">📸 Erinnerungen</a>
  </nav>

  <div id="board"></div>

  <div class="button-row">
    <button id="openDeleteMode" class="minus-btn">−</button>
    <button id="openAddModal" class="plus-btn">+</button>
  </div>

  <div id="addModal" class="modal hidden">
    <div class="modal-box">
      <h2>Neues Bingo-Feld</h2>

      <label>Titel</label>
      <input id="newItemInput" type="text" placeholder="z. B. 6x Wandern">

      <label>Kategorie</label>
      <select id="categoryInput">
        <option value="Liebe ❤️">Liebe ❤️</option>
        <option value="Reisen ✈️">Reisen ✈️</option>
        <option value="Sport 🏃">Sport 🏃</option>
        <option value="Lernen 📚">Lernen 📚</option>
        <option value="Geld 💰">Geld 💰</option>
        <option value="Sonstiges ⭐">Sonstiges ⭐</option>
      </select>

      <label>Verfasst von</label>
      <select id="authorInput">
        <option value="Isi">Isi</option>
        <option value="Benji">Benji</option>
      </select>

      <label>Fälligkeitsdatum</label>
      <input id="dueDateInput" type="date">

      <label>Fortschritt</label>
      <select id="targetInput">
        <option value="0">0</option>
        <option value="1" selected>1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
      </select>

      <div class="modal-buttons">
        <button id="addBtn">Hinzufügen</button>
        <button id="closeModal" class="secondary">Abbrechen</button>
      </div>
    </div>
  </div>

  <div id="deleteBar" class="delete-bar hidden">
    <span>Felder zum Löschen auswählen</span>

    <div class="delete-buttons">
      <button id="confirmDelete">Löschen bestätigen</button>
      <button id="cancelDelete" class="secondary">Abbrechen</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
