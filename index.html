<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Unser Bingo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Unser Bingo 💗</h1>

  <button id="openAddModal" class="floating-plus">+</button>

  <div id="board"></div>

  <div id="addModal" class="modal hidden">
    <div class="modal-box">
      <h2>Neues Ziel</h2>
      <input id="newItemInput" type="text" placeholder="Ziel eingeben...">
      <button id="addBtn">Hinzufügen</button>
      <button id="closeModal" class="secondary">Abbrechen</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
