<html lang="de">
<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#fdf5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191220" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Projekt Wir">

  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="game-anim.css">
  <link rel="stylesheet" href="game-room.css">
  <link rel="stylesheet" href="cabo.css">
  <script src="pin-lock.js"></script>

<body data-nav="games.html">

  <main class="page">
    <h1 class="page-title">Cabo 🦄</h1>
    <p class="page-subtitle">Merken, tauschen, bluffen</p>

    <div id="caboLobby" class="cabo-lobby"></div>

    <div id="caboBoard" class="cabo-board hidden">

      <div class="cabo-score-strip" id="caboScoreStrip"></div>

      <div class="cabo-opponents" id="caboOpponents"></div>

      <div class="cabo-table">
        <button type="button" class="cabo-pile" id="drawPile" title="Nachziehstapel">
          <div class="cabo-pile-top"><img src="cabo-cards/Cover.webp" alt="Nachziehstapel"></div>
          <span class="cabo-pile-count" id="drawPileCount"></span>
        </button>
        <button type="button" class="cabo-pile" id="discardPile" title="Ablagestapel"></button>
      </div>

      <p class="cabo-event" id="caboEvent"></p>
      <p class="cabo-status" id="caboStatus"></p>

      <div class="cabo-actions" id="caboActions"></div>

      <div class="cabo-side">
        <p class="cabo-player-label" id="ownLabel">Du</p>
        <div class="cabo-hand" id="ownHand"></div>
      </div>

      <div class="cabo-leave">
        <button type="button" id="leaveGameBtn" class="cabo-leave-btn">Spiel beenden</button>
      </div>

    </div>
  </main>

  <div id="personModal" class="modal hidden">
    <div class="modal-box">
      <h2>Wer bist du? 💗</h2>
      <p class="push-modal-text">Damit wir wissen, wer am Zug ist.</p>
      <div class="push-person-choice">
        <button class="btn person-choice-btn" data-person="Isi">Ich bin Isi</button>
        <button class="btn btn-secondary person-choice-btn" data-person="Benji">Ich bin Benji</button>
      </div>
    </div>
  </div>

  <nav class="app-nav" aria-label="Hauptnavigation">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
    <a href="mochi.html" class="nav-item"><span class="nav-icon">🎂</span><span class="nav-label">Mochi</span></a>

    <a href="ziele.html" class="nav-item"><span class="nav-icon">🎯</span><span class="nav-label">Ziele</span></a>
    <a href="reise.html" class="nav-item"><span class="nav-icon">✈️</span><span class="nav-label">Reise</span></a>
    <a href="games.html" class="nav-item"><span class="nav-icon">🎮</span><span class="nav-label">Games</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js"></script>
  <script src="cabo-engine.js"></script>
  <script src="game-anim.js"></script>
  <script src="game-room.js"></script>
  <script src="cabo.js"></script>
</body>
</html>
