<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projekt Wir - KPIs</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <link rel="stylesheet" href="kpis.css">
</head>
<body>

  <h1>Unsere KPIs 💗</h1>

<nav class="main-nav">
  <a href="index.html">🎯 Couple Quest</a>
  <a href="shopping.html">🛒 Einkaufsliste</a>
  <a href="kpis.html">📊 KPIs</a>
  <a href="erinnerungen.html">📸 Erinnerungen</a>
  <a href="questions.html">💬 Questions</a>
</nav>

  <div class="kpi-grid">

    <div class="flip-card">
      <div class="flip-inner">
        <div class="kpi-card flip-front">
          <span class="icon">👀</span>
          <h2>Erstes Treffen</h2>
          <p id="firstMeetingDate"></p>
          <p id="firstMeetingPlace"></p>
        </div>

        <div class="kpi-card flip-back">
          <img src="images/erstes-treffen.jpg" alt="Erstes Treffen">
        </div>
      </div>
    </div>

    <div class="flip-card">
      <div class="flip-inner">
        <div class="kpi-card flip-front">
          <span class="icon">🌹</span>
          <h2>Erstes Date</h2>
          <p id="firstDateDate"></p>
          <p id="firstDatePlace"></p>
        </div>

        <div class="kpi-card flip-back">
          <img src="images/erstes-date.jpg" alt="Erstes Date">
        </div>
      </div>
    </div>

    <div class="flip-card">
      <div class="flip-inner">
        <div class="kpi-card flip-front">
          <span class="icon">💍</span>
          <h2>Jahrestag</h2>
          <p id="anniversaryDate"></p>
          <p id="anniversaryPlace"></p>
        </div>

        <div class="kpi-card flip-back">
          <img src="images/jahrestag.jpg" alt="Jahrestag">
        </div>
      </div>
    </div>

    <div class="flip-card">
      <div class="flip-inner">
        <div class="kpi-card flip-front highlight">
          <span class="icon">⏳</span>
          <h2>Tage zusammen</h2>
          <p id="daysTogether" class="big-number"></p>
        </div>

        <div class="kpi-card flip-back">
          <img src="images/tage-zusammen.jpg" alt="Tage zusammen">
        </div>
      </div>
    </div>

  </div>

  <script src="kpis.js"></script>
</body>
</html>
