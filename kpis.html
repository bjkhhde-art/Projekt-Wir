<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I + B | KPIs</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="kpis.css">
</head>
<body>

  <main class="page">
    <h1 class="page-title">Unsere KPIs 💗</h1>
    <p class="page-subtitle">Tippe auf eine Karte für ein Foto · Zahlen, die zählen</p>

    <div class="kpi-grid">

      <div class="flip-card">
        <div class="flip-inner">
          <div class="kpi-card flip-front card">
            <span class="icon">👀</span>
            <h2>Erstes Treffen</h2>
            <p id="firstMeetingDate"></p>
            <p class="kpi-place" id="firstMeetingPlace"></p>
          </div>

          <div class="kpi-card flip-back card">
            <img src="images/erstes-treffen.jpg" alt="Erstes Treffen">
          </div>
        </div>
      </div>

      <div class="flip-card">
        <div class="flip-inner">
          <div class="kpi-card flip-front card">
            <span class="icon">🌹</span>
            <h2>Erstes Date</h2>
            <p id="firstDateDate"></p>
            <p class="kpi-place" id="firstDatePlace"></p>
          </div>

          <div class="kpi-card flip-back card">
            <img src="images/erstes-date.jpg" alt="Erstes Date">
          </div>
        </div>
      </div>

      <div class="flip-card">
        <div class="flip-inner">
          <div class="kpi-card flip-front card">
            <span class="icon">💍</span>
            <h2>Jahrestag</h2>
            <p id="anniversaryDate"></p>
            <p class="kpi-place" id="anniversaryPlace"></p>
          </div>

          <div class="kpi-card flip-back card">
            <img src="images/jahrestag.jpg" alt="Jahrestag">
          </div>
        </div>
      </div>

      <div class="flip-card">
        <div class="flip-inner">
          <div class="kpi-card flip-front highlight card">
            <span class="icon">⏳</span>
            <h2>Tage zusammen</h2>
            <p id="daysTogether" class="big-number"></p>
          </div>

          <div class="kpi-card flip-back card">
            <img src="images/tage-zusammen.jpg" alt="Tage zusammen">
          </div>
        </div>
      </div>

      <div class="kpi-card highlight card kpi-countdown">
        <span class="icon">🎂</span>
        <h2>Nächster Jahrestag</h2>
        <p id="nextAnniversaryCountdown" class="big-number"></p>
        <p class="kpi-place" id="nextAnniversaryDate"></p>
      </div>

    </div>
  </main>

  <nav class="app-nav" aria-label="Hauptnavigation">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
    <a href="couple-quest.html" class="nav-item"><span class="nav-icon">🎯</span><span class="nav-label">Quest</span></a>
    <a href="batterien.html" class="nav-item"><span class="nav-icon">🔋</span><span class="nav-label">Akku</span></a>
    <a href="kpis.html" class="nav-item"><span class="nav-icon">📊</span><span class="nav-label">KPIs</span></a>
    <a href="erinnerungen.html" class="nav-item"><span class="nav-icon">📸</span><span class="nav-label">Trips</span></a>
    <a href="questions.html" class="nav-item"><span class="nav-icon">💬</span><span class="nav-label">Fragen</span></a>
    <a href="liebesbriefe.html" class="nav-item"><span class="nav-icon">💌</span><span class="nav-label">Briefe</span></a>
    <a href="date-night.html" class="nav-item"><span class="nav-icon">🌙</span><span class="nav-label">Dates</span></a>
  </nav>

  <script src="shared.js"></script>
  <script src="kpis.js"></script>
</body>
</html>
