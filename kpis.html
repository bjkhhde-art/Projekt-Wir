<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>I + B | KPIs</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#fdf5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191220" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Projekt Wir">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="kpis.css">
  <script src="pin-lock.js"></script>
</head>
<body>

  <main class="page">
    <h1 class="page-title">Unsere KPIs 💗</h1>
    <p class="page-subtitle">Wir tippen auf eine Karte für ein Foto · Zahlen, die zählen</p>

    <div class="kpi-grid">

      <div class="flip-card">
        <div class="flip-inner">
          <div class="kpi-card flip-front card">
            <span class="icon">👀</span>
            <h2>Erstes Treffen</h2>
            <p id="firstMeetingDate"></p>
            <p class="kpi-place" id="firstMeetingPlace"></p>
          </div>

          <div class="kpi-card flip-back card">
            <img src="images/erstes-treffen.webp" alt="Erstes Treffen" loading="lazy" decoding="async">
          </div>
        </div>
      </div>

      <div class="flip-card">
        <div class="flip-inner">
          <div class="kpi-card flip-front card">
            <span class="icon">🌹</span>
            <h2>Erstes Date</h2>
            <p id="firstDateDate"></p>
            <p class="kpi-place" id="firstDatePlace"></p>
          </div>

          <div class="kpi-card flip-back card">
            <img src="images/erstes-date.webp" alt="Erstes Date" loading="lazy" decoding="async">
          </div>
        </div>
      </div>

      <div class="flip-card">
        <div class="flip-inner">
          <div class="kpi-card flip-front card">
            <span class="icon">💍</span>
            <h2>Jahrestag</h2>
            <p id="anniversaryDate"></p>
            <p class="kpi-place" id="anniversaryPlace"></p>
          </div>

          <div class="kpi-card flip-back card">
            <img src="images/jahrestag.webp" alt="Jahrestag" loading="lazy" decoding="async">
          </div>
        </div>
      </div>

      <div class="flip-card">
        <div class="flip-inner">
          <div class="kpi-card flip-front highlight card">
            <span class="icon">⏳</span>
            <h2>Tage zusammen</h2>
            <p id="daysTogether" class="big-number"></p>
          </div>

          <div class="kpi-card flip-back card">
            <img src="images/tage-zusammen.webp" alt="Tage zusammen" loading="lazy" decoding="async">
          </div>
        </div>
      </div>

      <div class="kpi-card highlight card kpi-countdown">
        <span class="icon">🎂</span>
        <h2>Nächster Jahrestag</h2>
        <p id="nextAnniversaryCountdown" class="big-number"></p>
        <p class="kpi-place" id="nextAnniversaryDate"></p>
      </div>

    </div>
  </main>

  <nav class="app-nav" aria-label="Hauptnavigation">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
    <a href="mochi.html" class="nav-item"><span class="nav-icon">🎂</span><span class="nav-label">Mochi</span></a>
    <a href="batterien.html" class="nav-item"><span class="nav-icon">🔋</span><span class="nav-label">Akku</span></a>
    <a href="wir.html" class="nav-item"><span class="nav-icon">💬</span><span class="nav-label">Wir</span></a>
    <a href="ziele.html" class="nav-item"><span class="nav-icon">🎯</span><span class="nav-label">Ziele</span></a>
    <a href="reise.html" class="nav-item"><span class="nav-icon">✈️</span><span class="nav-label">Reise</span></a>
    <a href="games.html" class="nav-item"><span class="nav-icon">🎮</span><span class="nav-label">Games</span></a>
  </nav>

  <script src="shared.js"></script>
  <script src="kpis.js"></script>
</body>
</html>
