<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I + B | Date Night</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="date-night.css">
</head>
<body>

  <main class="page">
    <h1 class="page-title">Date Night 🌙</h1>
    <p class="page-subtitle">Ideen sammeln, Dates einplanen, Erinnerungen sammeln</p>

    <div id="nextDateCard" class="next-date-card card"></div>

    <section class="dn-section">
      <h2 class="dn-section-title">📅 Geplante Dates</h2>
      <div id="plannedList" class="dn-list"></div>
    </section>

    <section class="dn-section">
      <h2 class="dn-section-title">💡 Ideen-Pool</h2>
      <div id="ideaList" class="dn-list"></div>
    </section>

    <section class="dn-section">
      <button id="toggleHistoryBtn" class="btn btn-secondary btn-sm">Verlauf anzeigen</button>
      <div id="historyList" class="dn-list hidden"></div>
    </section>
  </main>

  <button id="openIdeaModal" class="fab" title="Neue Date-Idee" aria-label="Neue Date-Idee">+</button>

  <div id="ideaModal" class="modal hidden">
    <div class="modal-box">
      <h2>Neue Date-Idee</h2>

      <label>Titel</label>
      <input id="ideaTitleInput" type="text" placeholder="z. B. Picknick im Park">

      <label>Kategorie</label>
      <select id="ideaCategoryInput">
        <option value="Zuhause 🏠">Zuhause 🏠</option>
        <option value="Restaurant 🍽️">Restaurant 🍽️</option>
        <option value="Abenteuer 🌲">Abenteuer 🌲</option>
        <option value="Kultur 🎭">Kultur 🎭</option>
        <option value="Wellness 💆">Wellness 💆</option>
        <option value="Sonstiges ✨">Sonstiges ✨</option>
      </select>

      <label>Notiz (optional)</label>
      <input id="ideaNotesInput" type="text" placeholder="z. B. Sonnenuntergang nicht verpassen">

      <label>Vorgeschlagen von</label>
      <select id="ideaAuthorInput">
        <option value="Isi">Isi</option>
        <option value="Benji">Benji</option>
      </select>

      <div class="modal-buttons">
        <button id="saveIdeaBtn" class="btn">Idee speichern</button>
        <button id="closeIdeaModal" class="btn btn-secondary">Abbrechen</button>
      </div>
    </div>
  </div>

  <div id="scheduleModal" class="modal hidden">
    <div class="modal-box">
      <h2>Date einplanen</h2>

      <label>Wann?</label>
      <input id="scheduleDateInput" type="date">

      <div class="modal-buttons">
        <button id="confirmScheduleBtn" class="btn">Einplanen</button>
        <button id="closeScheduleModal" class="btn btn-secondary">Abbrechen</button>
      </div>
    </div>
  </div>

  <nav class="app-nav" aria-label="Hauptnavigation">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
    <a href="couple-quest.html" class="nav-item"><span class="nav-icon">🎯</span><span class="nav-label">Quest</span></a>
    <a href="batterien.html" class="nav-item"><span class="nav-icon">🔋</span><span class="nav-label">Akku</span></a>
    <a href="kpis.html" class="nav-item"><span class="nav-icon">📊</span><span class="nav-label">KPIs</span></a>
    <a href="erinnerungen.html" class="nav-item"><span class="nav-icon">📸</span><span class="nav-label">Trips</span></a>
    <a href="questions.html" class="nav-item"><span class="nav-icon">💬</span><span class="nav-label">Fragen</span></a>
    <a href="liebesbriefe.html" class="nav-item"><span class="nav-icon">💌</span><span class="nav-label">Briefe</span></a>
    <a href="date-night.html" class="nav-item"><span class="nav-icon">🌙</span><span class="nav-label">Dates</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js"></script>
  <script src="date-night.js"></script>
</body>
</html>
