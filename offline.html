<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>I + B | Offline</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#fdf5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191220" media="(prefers-color-scheme: dark)">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #fdf5f9;
      color: #2a1f33;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #191220; color: #f4ecf7; }
    }
    .box { max-width: 340px; }
    .icon { font-size: 56px; }
    h1 { font-size: 22px; margin: 12px 0 8px; }
    p { margin: 0 0 20px; line-height: 1.5; opacity: 0.8; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 26px;
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #ff5c8a, #9b5cf6);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon" aria-hidden="true">📡💗</div>
    <h1>Gerade keine Verbindung</h1>
    <p>Projekt Wir braucht Internet, um eure Sachen zu laden. Sobald das Netz wieder da ist, geht's weiter.</p>
    <button type="button" onclick="location.reload()">Nochmal versuchen</button>
  </div>
</body>
</html>
