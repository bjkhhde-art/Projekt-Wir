<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I + B | Einkaufsliste</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="shopping.css">
</head>
<body>

  <main class="page">
    <h1 class="page-title">Einkaufsliste 🛒</h1>
    <p class="page-subtitle">Live synchronisiert – wer einkauft, hakt ab</p>

    <div id="shoppingList" class="shopping-list"></div>
  </main>

  <button id="openAddItemModal" class="fab" title="Artikel hinzufügen" aria-label="Artikel hinzufügen">+</button>

  <div id="addItemModal" class="modal hidden">
    <div class="modal-box">
      <h2>Neuer Artikel</h2>

      <label>Was wird gebraucht?</label>
      <input id="itemTitleInput" type="text" placeholder="z. B. Milch">

      <label>Menge (optional)</label>
      <input id="itemQuantityInput" type="text" placeholder="z. B. 2x oder 1 Liter">

      <label>Kategorie</label>
      <select id="itemCategoryInput">
        <option value="Lebensmittel 🥦">Lebensmittel 🥦</option>
        <option value="Drogerie 🧴">Drogerie 🧴</option>
        <option value="Haushalt 🏠">Haushalt 🏠</option>
        <option value="Sonstiges 🛒">Sonstiges 🛒</option>
      </select>

      <label>Hinzugefügt von</label>
      <select id="itemAuthorInput">
        <option value="Isi">Isi</option>
        <option value="Benji">Benji</option>
      </select>

      <div class="modal-buttons">
        <button id="addItemBtn" class="btn">Hinzufügen</button>
        <button id="closeAddItemModal" class="btn btn-secondary">Abbrechen</button>
      </div>
    </div>
  </div>

  <nav class="app-nav" aria-label="Hauptnavigation">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
    <a href="couple-quest.html" class="nav-item"><span class="nav-icon">🎯</span><span class="nav-label">Quest</span></a>
    <a href="shopping.html" class="nav-item"><span class="nav-icon">🛒</span><span class="nav-label">Liste</span></a>
    <a href="kpis.html" class="nav-item"><span class="nav-icon">📊</span><span class="nav-label">KPIs</span></a>
    <a href="erinnerungen.html" class="nav-item"><span class="nav-icon">📸</span><span class="nav-label">Trips</span></a>
    <a href="questions.html" class="nav-item"><span class="nav-icon">💬</span><span class="nav-label">Fragen</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js"></script>
  <script src="shopping.js"></script>
</body>
</html>
