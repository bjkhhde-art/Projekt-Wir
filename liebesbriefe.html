<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I + B | Liebesbriefe</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">

<body>

  <main class="page">
    <h1 class="page-title">Liebesbriefe 💌</h1>
    <p class="page-subtitle">Kleine Nachrichten füreinander</p>

    <div id="notesFeed" class="notes-feed"></div>
  </main>

  <button id="openNoteModal" class="fab" title="Neue Nachricht" aria-label="Neue Nachricht">+</button>

  <div id="noteModal" class="modal hidden">
    <div class="modal-box">
      <h2>Neue Nachricht</h2>

      <label>Von</label>
      <select id="noteAuthorInput">
        <option value="Isi">Isi</option>
        <option value="Benji">Benji</option>
      </select>

      <label>Nachricht</label>
      <textarea id="noteMessageInput" rows="4" placeholder="Schreib etwas Liebes…"></textarea>

      <div class="modal-buttons">
        <button id="sendNoteBtn" class="btn">Absenden 💌</button>
        <button id="closeNoteModal" class="btn btn-secondary">Abbrechen</button>
      </div>
    </div>
  </div>

</body>
