<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I + B | Ziele</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vision.css">
  <script src="pin-lock.js"></script>
</head>
<body data-hub="ziele">

  <main class="page">
    <h1 class="page-title">Ziele 🎯</h1>
    <p class="page-subtitle">Unsere Couple Quest und die langfristige Vision</p>

    <div class="hub-tabs" role="tablist">
      <button class="hub-tab" data-tab="quest" role="tab">🎯 Quest</button>
      <button class="hub-tab" data-tab="vision" role="tab">🔭 Vision</button>
    </div>

    <section class="hub-panel" data-panel="quest">
      <div class="quest-toolbar">
        <button id="openDeleteMode" class="btn btn-secondary btn-sm">🗑️ Verwalten</button>
      </div>

      <div id="board"></div>
    </section>

    <section class="hub-panel" data-panel="vision" hidden>
      <div id="visionTimeline" class="vision-timeline"></div>
    </section>

  </main>

  <button id="openAddModal" class="fab" title="Neues Bingofeld" aria-label="Neues Bingofeld" data-show-for="quest">+</button>
  <button id="openVisionModal" class="fab" title="Neues Ziel" aria-label="Neues Ziel" data-show-for="vision">+</button>

  <div id="addModal" class="modal hidden">
    <div class="modal-box">
      <h2 id="questModalTitle">Neues Bingofeld</h2>

      <label>Titel</label>
      <input id="newItemInput" type="text" placeholder="z. B. 6x Wandern">

      <label>Kategorie</label>
      <select id="categoryInput">
        <option value="Liebe ❤️">Liebe ❤️</option>
        <option value="Reisen ✈️">Reisen ✈️</option>
        <option value="Sport 🏃">Sport 🏃</option>
        <option value="Lernen 📚">Lernen 📚</option>
        <option value="Geld 💰">Geld 💰</option>
        <option value="Sonstiges ⭐">Sonstiges ⭐</option>
      </select>

      <label>Verfasst von</label>
      <select id="authorInput">
        <option value="Isi">Isi</option>
        <option value="Benji">Benji</option>
      </select>

      <label>Fälligkeitsdatum</label>
      <input id="dueDateInput" type="date">

      <label>Fortschrittsziel</label>
      <select id="targetInput">
        <option value="0">0</option>
        <option value="1" selected>1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
      </select>

      <div class="modal-buttons">
        <button id="addBtn" class="btn">Hinzufügen</button>
        <button id="closeModal" class="btn btn-secondary">Abbrechen</button>
      </div>
    </div>
  </div>

  <div id="deleteBar" class="delete-bar card hidden">
    <span>Felder zum Löschen auswählen</span>

    <div class="delete-buttons">
      <button id="confirmDelete" class="btn btn-danger">Löschen bestätigen</button>
      <button id="cancelDelete" class="btn btn-secondary">Abbrechen</button>
    </div>
  </div>

  <div id="visionModal" class="modal hidden">
    <div class="modal-box">
      <h2 id="visionModalTitle">Neues Ziel</h2>

      <label>Titel</label>
      <input id="visionTitleInput" type="text" placeholder="z. B. Eigenes Haus">

      <label>Beschreibung</label>
      <textarea id="visionDescInput" rows="3" placeholder="Was genau stellen wir uns vor?"></textarea>

      <label>Für welches Jahr?</label>
      <select id="visionYearInput"></select>

      <label>Bild (optional)</label>
      <div id="visionCoverPreviewWrap" class="cover-preview hidden">
        <img id="visionCoverPreviewImg" src="" alt="Aktuelles Bild">
      </div>
      <input id="visionCoverInput" type="file" accept="image/*">

      <div class="modal-buttons">
        <button id="saveVisionBtn" class="btn">Ziel eintragen</button>
        <button id="closeVisionModal" class="btn btn-secondary">Abbrechen</button>
      </div>
    </div>
  </div>

  <div id="personModal" class="modal hidden">
    <div class="modal-box">
      <h2>Wer bist du? 💗</h2>
      <p class="push-modal-text">Damit wir wissen, wer dieses Ziel eingetragen hat.</p>
      <div class="push-person-choice">
        <button class="btn person-choice-btn" data-person="Isi">Ich bin Isi</button>
        <button class="btn btn-secondary person-choice-btn" data-person="Benji">Ich bin Benji</button>
      </div>
    </div>
  </div>

  <nav class="app-nav" aria-label="Hauptnavigation">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
    <a href="mochi.html" class="nav-item"><span class="nav-icon">🎂</span><span class="nav-label">Mochi</span></a>
    <a href="batterien.html" class="nav-item"><span class="nav-icon">🔋</span><span class="nav-label">Akku</span></a>
    <a href="wir.html" class="nav-item"><span class="nav-icon">💬</span><span class="nav-label">Wir</span></a>
    <a href="ziele.html" class="nav-item"><span class="nav-icon">🎯</span><span class="nav-label">Ziele</span></a>
    <a href="reise.html" class="nav-item"><span class="nav-icon">✈️</span><span class="nav-label">Reise</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js"></script>
  <script src="hub-tabs.js"></script>
  <script src="app.js"></script>
  <script src="vision.js"></script>
</body>
</html>
