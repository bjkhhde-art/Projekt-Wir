<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I + B | Ziele</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <script>
    /* Couple Quest moved to the Games tab; old links (e.g. from push notifications) still find it */
    if (new URLSearchParams(location.search).get("tab") === "quest") location.replace("couple-quest.html");
  </script>

  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="vision.css">
  <script src="pin-lock.js"></script>
</head>
<body>

  <main class="page">
    <h1 class="page-title">Ziele 🎯</h1>
    <p class="page-subtitle">Unsere langfristige Vision</p>

    <div id="visionTimeline" class="vision-timeline"></div>
  </main>

  <button id="openVisionModal" class="fab" title="Neues Ziel" aria-label="Neues Ziel">+</button>

  <div id="visionModal" class="modal hidden">
    <div class="modal-box">
      <h2 id="visionModalTitle">Neues Ziel</h2>

      <label>Titel</label>
      <input id="visionTitleInput" type="text" placeholder="z. B. Eigenes Haus">

      <label>Beschreibung</label>
      <textarea id="visionDescInput" rows="3" placeholder="Was genau stellen wir uns vor?"></textarea>

      <label>Für welches Jahr?</label>
      <select id="visionYearInput"></select>

      <label>Bild (optional)</label>
      <div id="visionCoverPreviewWrap" class="cover-preview hidden">
        <img id="visionCoverPreviewImg" src="" alt="Aktuelles Bild">
      </div>
      <input id="visionCoverInput" type="file" accept="image/*">

      <div class="modal-buttons">
        <button id="saveVisionBtn" class="btn">Ziel eintragen</button>
        <button id="closeVisionModal" class="btn btn-secondary">Abbrechen</button>
      </div>
    </div>
  </div>

  <div id="personModal" class="modal hidden">
    <div class="modal-box">
      <h2>Wer bist du? 💗</h2>
      <p class="push-modal-text">Damit wir wissen, wer dieses Ziel eingetragen hat.</p>
      <div class="push-person-choice">
        <button class="btn person-choice-btn" data-person="Isi">Ich bin Isi</button>
        <button class="btn btn-secondary person-choice-btn" data-person="Benji">Ich bin Benji</button>
      </div>
    </div>
  </div>

  <nav class="app-nav" aria-label="Hauptnavigation">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
    <a href="mochi.html" class="nav-item"><span class="nav-icon">🎂</span><span class="nav-label">Mochi</span></a>
    <a href="batterien.html" class="nav-item"><span class="nav-icon">🔋</span><span class="nav-label">Akku</span></a>
    <a href="wir.html" class="nav-item"><span class="nav-icon">💬</span><span class="nav-label">Wir</span></a>
    <a href="ziele.html" class="nav-item"><span class="nav-icon">🎯</span><span class="nav-label">Ziele</span></a>
    <a href="reise.html" class="nav-item"><span class="nav-icon">✈️</span><span class="nav-label">Reise</span></a>
    <a href="games.html" class="nav-item"><span class="nav-icon">🎮</span><span class="nav-label">Games</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js"></script>
  <script src="vision.js"></script>
</body>
</html>
