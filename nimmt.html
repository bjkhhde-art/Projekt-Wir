  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="nm-bull" viewBox="0 0 24 24">
      <path d="M2.6 4.4c.3 3.1 2.4 4.9 5.3 5M21.4 4.4c-.3 3.1-2.4 4.9-5.3 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>

  <main class="page">
    <h1 class="page-title">6 nimmt! 🐮</h1>
    <p class="page-subtitle">Bloß keine Hornochsen kassieren</p>

    <div id="nmLobby"></div>

    <div id="nmBoard" class="nm-board hidden">

      <div class="nm-score" id="nmScore"></div>

      <div class="nm-opps" id="nmOpps"></div>

      <div class="nm-spots" id="nmSpots"></div>

      <div class="nm-rows" id="nmRows"></div>

      <p class="nm-event" id="nmEvent"></p>
      <p class="nm-status" id="nmStatus"></p>
      <div class="nm-actions" id="nmActions"></div>

      <div class="nm-player nm-player-own">
        <span class="nm-player-name">Du</span>
        <span class="nm-pile" id="nmOwnPile"></span>
      </div>
      <div class="nm-hand" id="nmHand"></div>

      <div class="gr-leave">
        <button type="button" id="nmLeaveBtn" class="gr-leave-btn">Spiel beenden</button>
      </div>
    </div>
  </main>

  <div id="personModal" class="modal hidden">
    <div class="modal-box">
      <h2>Wer bist du? 💗</h2>
      <p class="push-modal-text">Damit wir wissen, wer welche Karten hat.</p>
      <div class="push-person-choice">
        <button class="btn person-choice-btn" data-person="Isi">Ich bin Isi</button>
        <button class="btn btn-secondary person-choice-btn" data-person="Benji">Ich bin Benji</button>

    </div>
