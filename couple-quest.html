<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I + B | Quests</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="style.css">
  <script src="pin-lock.js"></script>
</head>
<body>

  <main class="page">
    <h1 class="page-title">Couple Quest 🎯</h1>
    <p class="page-subtitle">Tippt ein Feld an, um den Fortschritt zu erhöhen</p>

    <div class="quest-toolbar">
      <button id="openDeleteMode" class="btn btn-secondary btn-sm">🗑️ Verwalten</button>
    </div>

    <div id="board"></div>
  </main>

  <button id="openAddModal" class="fab" title="Neues Bingo-Feld" aria-label="Neues Bingo-Feld">+</button>

  <div id="addModal" class="modal hidden">
    <div class="modal-box">
      <h2 id="questModalTitle">Neues Bingo-Feld</h2>

      <label>Titel</label>
      <input id="newItemInput" type="text" placeholder="z. B. 6x Wandern">

      <label>Kategorie</label>
      <select id="categoryInput">
        <option value="Liebe ❤️">Liebe ❤️</option>
        <option value="Reisen ✈️">Reisen ✈️</option>
        <option value="Sport 🏃">Sport 🏃</option>
        <option value="Lernen 📚">Lernen 📚</option>
        <option value="Geld 💰">Geld 💰</option>
        <option value="Sonstiges ⭐">Sonstiges ⭐</option>
      </select>

      <label>Verfasst von</label>
      <select id="authorInput">
        <option value="Isi">Isi</option>
        <option value="Benji">Benji</option>
      </select>

      <label>Fälligkeitsdatum</label>
      <input id="dueDateInput" type="date">

      <label>Fortschrittsziel</label>
      <select id="targetInput">
        <option value="0">0</option>
        <option value="1" selected>1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
      </select>

      <div class="modal-buttons">
        <button id="addBtn" class="btn">Hinzufügen</button>
        <button id="closeModal" class="btn btn-secondary">Abbrechen</button>
      </div>
    </div>
  </div>

  <div id="deleteBar" class="delete-bar card hidden">
    <span>Felder zum Löschen auswählen</span>

    <div class="delete-buttons">
      <button id="confirmDelete" class="btn btn-danger">Löschen bestätigen</button>
      <button id="cancelDelete" class="btn btn-secondary">Abbrechen</button>
    </div>
  </div>

  <nav class="app-nav" aria-label="Hauptnavigation">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
    <a href="couple-quest.html" class="nav-item"><span class="nav-icon">🎯</span><span class="nav-label">Quest</span></a>
    <a href="batterien.html" class="nav-item"><span class="nav-icon">🔋</span><span class="nav-label">Akku</span></a>
    <a href="kpis.html" class="nav-item"><span class="nav-icon">📊</span><span class="nav-label">KPIs</span></a>
    <a href="erinnerungen.html" class="nav-item"><span class="nav-icon">📸</span><span class="nav-label">Trips</span></a>
    <a href="questions.html" class="nav-item"><span class="nav-icon">💬</span><span class="nav-label">Fragen</span></a>
    <a href="liebesbriefe.html" class="nav-item"><span class="nav-icon">💌</span><span class="nav-label">Briefe</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js"></script>
  <script src="app.js"></script>
</body>
</html>
