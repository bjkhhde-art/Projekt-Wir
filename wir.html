<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>I + B | Wir</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#fdf5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191220" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Projekt Wir">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <script>
    /* the questions moved to the Games tab; old links still find them */
    if (new URLSearchParams(location.search).get("tab") === "fragen") location.replace("questions.html");
  </script>

  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="watchlist.css">
  <link rel="stylesheet" href="liebesbriefe.css">
  <script src="pin-lock.js"></script>
</head>
<body data-hub="wir">

  <main class="page">
    <h1 class="page-title">Wir 💬</h1>
    <p class="page-subtitle">Watchlist und kleine Nachrichten füreinander</p>

    <div class="hub-tabs" role="tablist">
      <button class="hub-tab" data-tab="watchlist" role="tab">🎬 Watchlist</button>
      <button class="hub-tab" data-tab="briefe" role="tab">💌 Briefe</button>
    </div>

    <section class="hub-panel" data-panel="watchlist">

      <input id="watchlistSearchInput" type="search" class="watchlist-search" placeholder="🔍 Suchen...">

      <div class="watchlist-filter">
        <button class="watchlist-filter-btn active" data-filter="alle">Alle</button>
        <button class="watchlist-filter-btn" data-filter="film">🎬 Filme</button>
        <button class="watchlist-filter-btn" data-filter="serie">📺 Serien</button>
      </div>

      <div id="watchlistList" class="watchlist-list"></div>

    </section>

    <section class="hub-panel" data-panel="briefe" hidden>
      <div id="notesFeed" class="notes-feed"></div>
    </section>

  </main>

  <button id="openWatchlistModal" class="fab" title="Neuer Eintrag" aria-label="Neuer Eintrag" data-show-for="watchlist">+</button>
  <button id="openNoteModal" class="fab" title="Neue Nachricht" aria-label="Neue Nachricht" data-show-for="briefe">+</button>

  <div id="watchlistModal" class="modal hidden">
    <div class="modal-box">
      <h2 id="watchlistModalTitle">Neuer Eintrag</h2>

      <label>Titel</label>
      <input id="watchlistTitleInput" type="text" placeholder="z. B. Dune">

      <label>Film oder Serie?</label>
      <select id="watchlistTypeInput">
        <option value="film">🎬 Film</option>
        <option value="serie">📺 Serie</option>
      </select>

      <label>Wo schauen? (optional)</label>
      <input id="watchlistPlatformInput" type="text" placeholder="z. B. Netflix, Kino, Prime Video">

      <label>Hinzugefügt von</label>
      <select id="watchlistAddedByInput">
        <option value="Isi">Isi</option>
        <option value="Benji">Benji</option>
      </select>

      <div class="modal-buttons">
        <button id="saveWatchlistBtn" class="btn">Hinzufügen</button>
        <button id="closeWatchlistModal" class="btn btn-secondary">Abbrechen</button>
      </div>
    </div>
  </div>

  <div id="noteModal" class="modal hidden">
    <div class="modal-box">
      <h2>Neue Nachricht</h2>

      <label>Von</label>
      <select id="noteAuthorInput">
        <option value="Isi">Isi</option>
        <option value="Benji">Benji</option>
      </select>

      <label>Nachricht</label>
      <textarea id="noteMessageInput" rows="4" placeholder="Schreib etwas Liebes…"></textarea>

      <div class="modal-buttons">
        <button id="sendNoteBtn" class="btn">Absenden 💌</button>
        <button id="closeNoteModal" class="btn btn-secondary">Abbrechen</button>
      </div>
    </div>
  </div>

  <div id="letterOverlay" class="letter-overlay hidden">
    <button id="deleteLetterBtn" class="close-lightbox delete-letter-btn" title="Löschen">🗑️</button>
    <button id="closeLetterOverlay" class="close-lightbox" title="Schließen">×</button>

    <div class="envelope-scene">
      <div class="envelope-big" id="envelopeBig">
        <div class="letter-paper" id="letterPaper">
          <p class="letter-date" id="letterDate"></p>
          <p class="letter-message" id="letterMessage"></p>
          <p class="letter-signature" id="letterSignature"></p>
        </div>

        <div class="envelope-body">
          <span class="envelope-seal">💗</span>
        </div>

        <div class="envelope-flap" id="envelopeFlap">
          <div class="envelope-mini-stamp"><span class="stamp-icon">💗</span></div>
          <span class="postmark"></span>
          <span class="flap-arrow">▲</span>
          <span class="flap-hint">Hoch wischen<br>zum Öffnen</span>
        </div>
      </div>
    </div>
  </div>

  <nav class="app-nav" aria-label="Hauptnavigation">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
    <a href="mochi.html" class="nav-item"><span class="nav-icon">🎂</span><span class="nav-label">Mochi</span></a>
    <a href="batterien.html" class="nav-item"><span class="nav-icon">🔋</span><span class="nav-label">Akku</span></a>
    <a href="wir.html" class="nav-item"><span class="nav-icon">💬</span><span class="nav-label">Wir</span></a>
    <a href="ziele.html" class="nav-item"><span class="nav-icon">🎯</span><span class="nav-label">Ziele</span></a>
    <a href="reise.html" class="nav-item"><span class="nav-icon">✈️</span><span class="nav-label">Reise</span></a>
    <a href="games.html" class="nav-item"><span class="nav-icon">🎮</span><span class="nav-label">Games</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js"></script>
  <script src="hub-tabs.js"></script>
  <script src="watchlist.js"></script>
  <script src="liebesbriefe.js"></script>
</body>
</html>
